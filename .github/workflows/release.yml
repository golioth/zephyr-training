name: Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release Version.'
                required: true
                default: 'v0.0.0'
                type: string

jobs:
    build-binaries:
        strategy:
            matrix:
              include:
                - BOARD: nrf9160dk/nrf9160/ns
                  ZEPHYR_SDK: 0.17.4
                  HEX_FILE: merged.hex
                - BOARD: nrf7002dk/nrf5340/cpuapp
                  ZEPHYR_SDK: 0.17.4
                  HEX_FILE: zephyr.hex

        uses: ./.github/workflows/build_zephyr.yml
        with:
          ZEPHYR_SDK: ${{ matrix.ZEPHYR_SDK }}
          BOARD: ${{ matrix.BOARD }}
          ARTIFACT: true
          HEX_FILE: ${{ matrix.HEX_FILE }}
          TAG: ${{ inputs.version }}

    upload-binaries:
        needs: build-binaries

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Download artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                pattern: build_artifacts_*
                path: ~/artifacts
                merge-multiple: true

            - name: Create Release manually with GH CLI
              run: gh release create --title ${{ inputs.version }} --draft ${{ inputs.version }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload artifacts to release
              run: gh release upload --clobber ${{ inputs.version }} ~/artifacts/*.*
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
