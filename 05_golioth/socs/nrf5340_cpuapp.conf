CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_BUSLIB=y

CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_GOLIOTH_SAMPLE_WIFI=y
CONFIG_GOLIOTH_SAMPLE_WIFI_STACK_SIZE=4096

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NET_DHCPV4=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1

# Recommended by Nordic:
# https://github.com/nrfconnect/sdk-nrf/blob/v3.1.1/samples/wifi/sta/prj.conf#L34-L40
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=37000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NET_TC_TX_COUNT=1

CONFIG_MBEDTLS_HEAP_SIZE=12288
CONFIG_SHELL_STACK_SIZE=6144
